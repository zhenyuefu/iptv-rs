[package]
name = "iptv-rs"
version = "0.1.0"
edition = "2024"
description = "Rust IPTV live-source and EPG aggregator inspired by Guovin/iptv-api"
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = "0.3"
ipnet = { version = "2", features = ["serde"] }
lru = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
fancy-regex = "0.16"
flate2 = "1.0"
regex = "1.12.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "stream", "gzip", "rustls-tls"] }
url = { version = "2.5", features = ["serde"] }
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
